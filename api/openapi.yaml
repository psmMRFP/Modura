  /authorization/roles:
    get:
      operationId: listRoles
      summary: List roles in the authenticated tenant
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.roles, action: read }
      responses:
        "200":
          description: Tenant role list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Role" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
    post:
      operationId: createRole
      summary: Create an empty non-reserved tenant role
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.roles, action: create }
      parameters: [{ $ref: "#/components/parameters/CsrfToken" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateRoleRequest" }
      responses:
        "201":
          description: Role created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Role" }
        "400": { description: Invalid or duplicate role }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
  /authorization/permissions:
    get:
      operationId: listEffectivePermissions
      summary: List canonical permissions granted to the authenticated tenant actor
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: Effective canonical permission list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/EffectivePermission" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
  /authorization/roles/{roleId}/policies:
    get:
      operationId: getRolePolicySet
      summary: Read a role's versioned policy desired state
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.policies, action: read }
      parameters:
        - { $ref: "#/components/parameters/RoleId" }
      responses:
        "200":
          description: Current role policy desired state
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RolePolicySet" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Role not found in the tenant }
    put:
      operationId: replaceRolePolicies
      summary: Replace a non-reserved role's policy desired state
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.policies, action: update }
      parameters:
        - { $ref: "#/components/parameters/RoleId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceRolePoliciesRequest" }
      responses:
        "200":
          description: Policy desired state replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VersionResponse" }
        "400": { description: Invalid policy desired state }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Role not found in the tenant }
        "409": { description: Expected role version is stale }
  /authorization/users/{userId}/roles:
    get:
      operationId: getUserRoleGrants
      summary: Read a user's versioned role desired state
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.user-roles, action: read }
      parameters: [{ $ref: "#/components/parameters/UserId" }]
      responses:
        "200":
          description: Current user role grants
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRoleGrantSet" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: User not found in the tenant }
    put:
      operationId: replaceUserRoleGrants
      summary: Replace a user's non-reserved role grants with optimistic locking
      tags: [authorization]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: authorization.user-roles, action: update }
      parameters:
        - { $ref: "#/components/parameters/UserId" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceUserRoleGrantsRequest" }
      responses:
        "200":
          description: User role grants replaced
          content:
            application/json:
              schema: { $ref: "#/components/schemas/UserRoleGrantSet" }
        "400": { description: Invalid desired state }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: User not found in the tenant }
        "409": { description: Expected grant version is stale }
  /settings/dictionaries:
    get:
      operationId: listDictionaries
      summary: List effective tenant-over-global dictionaries
      tags: [settings]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: settings.dictionaries, action: read }
      responses:
        "200":
          description: Effective dictionary list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dictionary" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
  /settings/dictionaries/{dictionaryCode}:
    put:
      operationId: replaceDictionary
      summary: Create or replace a complete tenant dictionary
      tags: [settings]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: settings.dictionaries, action: update }
      parameters:
        - { $ref: "#/components/parameters/DictionaryCode" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceDictionaryRequest" }
      responses:
        "200":
          description: Dictionary desired state stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dictionary" }
        "400": { description: Invalid dictionary desired state }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Tenant dictionary not found for an update }
        "409": { description: Expected dictionary version is stale }
    delete:
      operationId: deleteDictionary
      summary: Delete a tenant dictionary and reveal any global fallback
      tags: [settings]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: settings.dictionaries, action: delete }
      parameters:
        - { $ref: "#/components/parameters/DictionaryCode" }
        - { $ref: "#/components/parameters/ExpectedVersion" }
        - { $ref: "#/components/parameters/CsrfToken" }
      responses:
        "204": { description: Tenant dictionary deleted }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Tenant dictionary not found }
        "409": { description: Expected dictionary version is stale }
  /settings/configurations:
    get:
      operationId: listConfigurations
      summary: List effective non-secret configuration
      tags: [settings]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: settings.configurations, action: read }
      responses:
        "200":
          description: Effective configuration list
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Configuration" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
  /settings/configurations/{configurationKey}:
    put:
      operationId: putConfiguration
      summary: Create or replace an eligible tenant configuration override
      tags: [settings]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: settings.configurations, action: update }
      parameters:
        - { $ref: "#/components/parameters/ConfigurationKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutConfigurationRequest" }
      responses:
        "200":
          description: Tenant configuration override stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Configuration" }
        "400": { description: Value does not match the declared type }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Configuration definition not found }
        "409": { description: Expected configuration version is stale }
  /audit/events:
    get:
      operationId: listAuditEvents
      summary: List redacted audit events in the authenticated tenant
      tags: [audit]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: audit.events, action: read }
      parameters:
        - name: action
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resource
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Newest-first bounded tenant audit page
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AuditEvent" } }
        "400": { description: Invalid audit filter or page }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
  /audit/events/{eventId}:
    parameters:
      - $ref: "#/components/parameters/EventId"
    get:
      operationId: getAuditEvent
      summary: Read one redacted audit event in the authenticated tenant
      tags: [audit]
      security: [{ bearerAuth: [] }]
      x-modura-permission: { resource: audit.events, action: read }
      responses:
        "200":
          description: Redacted audit event with state snapshots
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuditEvent" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: Event not found in the tenant }
  /platform/audit-events:
    get:
      operationId: listPlatformAuditEvents
      summary: List redacted audit events across tenants as a global platform administrator
      tags: [audit]
      security:
        - platformBearerAuth: []
      parameters:
        - name: tenantId
          in: query
          schema: { type: string, format: uuid }
        - name: action
          in: query
          schema: { type: string, maxLength: 128 }
        - name: resource
          in: query
          schema: { type: string, maxLength: 128 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
      responses:
        "200":
          description: Newest-first bounded platform audit page
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/PlatformAuditEvent" }
        "400": { description: Invalid audit filter or page }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    platformBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PublicLocale:
      name: locale
      in: query
      schema:
        type: string
        enum: [en, zh-CN, de, fr, es]
        default: en
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      schema:
        type: string
        minLength: 32
        maxLength: 256
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        format: uuid
    DepartmentId:
      name: departmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PositionId:
      name: positionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EventId:
      name: eventId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DictionaryCode:
      name: dictionaryCode
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ConfigurationKey:
      name: configurationKey
      in: path
      required: true
      schema: { type: string, minLength: 1, maxLength: 64 }
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema: { type: integer, format: int64, minimum: 1 }
    TenantId:
      name: tenantId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    PublicInvalidQuery:
      description: Invalid query
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PublicUnavailable:
      description: Catalogue is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PublicInternalError:
      description: Internal error without private details
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthenticationFailed:
      description: Tenant or credentials are invalid, or the session is unavailable
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    CsrfFailed:
      description: CSRF validation failed
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    AuthorizationFailed:
      description: The authenticated actor lacks the required permission
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
  schemas:
    PlaceAlias:
      type: object
      additionalProperties: false
      required: [locale, name, preferred]
      properties:
        locale: {type: string, maxLength: 35}
        name: {type: string, minLength: 1, maxLength: 200}
        preferred: {type: boolean}
    PlaceDetails:
      type: object
      additionalProperties: false
      required: [name, timezone, latitude, longitude, currency, languages, aliases]
      properties:
        name: {type: string, minLength: 1, maxLength: 200}
        timezone: {type: string, nullable: true, maxLength: 128}
        latitude: {type: number, format: double, nullable: true, minimum: -90, maximum: 90}
        longitude: {type: number, format: double, nullable: true, minimum: -180, maximum: 180}
        currency: {type: string, nullable: true, pattern: '^[A-Z]{3}$'}
        languages:
          type: array
          maxItems: 20
          items: {type: string, maxLength: 35}
        aliases:
          type: array
          maxItems: 100
          items: {$ref: "#/components/schemas/PlaceAlias"}
    ManagedPlace:
      type: object
      required: [id, slug, type, parentId, countryCode, details, version, coverageLevel, publishedAt, createdAt, updatedAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string}
        type: {$ref: "#/components/schemas/PublicPlaceType"}
        parentId: {type: string, format: uuid, nullable: true}
        countryCode: {type: string}
        details: {$ref: "#/components/schemas/PlaceDetails"}
        version: {type: integer, format: int64, minimum: 1}
        coverageLevel: {type: integer, minimum: 0, maximum: 3}
        publishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    ManagedPlacePage:
      type: object
      required: [items, nextOffset]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/ManagedPlace"}
        nextOffset: {type: integer, nullable: true}
    PublicPlaceType:
      type: string
      enum: [country, region, island, city, district]
    CreatePlatformPlaceRequest:
      type: object
      additionalProperties: false
      required: [slug, type, parentId, countryCode, details, reason]
      properties:
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        type: {$ref: "#/components/schemas/PublicPlaceType"}
        parentId: {type: string, format: uuid, nullable: true}
        countryCode: {type: string, pattern: '^[A-Z]{2}$'}
        details: {$ref: "#/components/schemas/PlaceDetails"}
        reason: {type: string, minLength: 1, maxLength: 500}
    UpdatePlatformPlaceRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, details, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        details: {$ref: "#/components/schemas/PlaceDetails"}
        reason: {type: string, minLength: 1, maxLength: 500}
    SetPlacePublicationRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion, published, reason]
      properties:
        expectedVersion: {type: integer, format: int64, minimum: 1}
        published: {type: boolean}
        reason: {type: string, minLength: 1, maxLength: 500}
    PublicPlace:
      type: object
      required: [id, slug, name, displayName, type, parentId, countryCode, timezone, latitude, longitude, currency, languages, coverageLevel, publishedAt]
      properties:
        id: {type: string, format: uuid}
        slug: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        name: {type: string, description: Canonical name}
        displayName: {type: string, description: Preferred localized alias or canonical name}
        type: {$ref: "#/components/schemas/PublicPlaceType"}
        parentId: {type: string, format: uuid, nullable: true}
        countryCode: {type: string, pattern: '^[A-Z]{2}$'}
        timezone: {type: string, nullable: true}
        latitude: {type: number, format: double, minimum: -90, maximum: 90, nullable: true}
        longitude: {type: number, format: double, minimum: -180, maximum: 180, nullable: true}
        currency: {type: string, pattern: '^[A-Z]{3}$', nullable: true}
        languages:
          type: array
          items: {type: string}
        coverageLevel: {type: integer, minimum: 1, maximum: 3}
        publishedAt: {type: string, format: date-time, description: Catalogue publication time; not fact verification time}
    PublicPlacePage:
      type: object
      required: [items, nextOffset]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PublicPlace"
        nextOffset: {type: integer, nullable: true, minimum: 1}
    LoginRequest:
      type: object
      additionalProperties: false
      required: [tenant, login, password]
      properties:
        tenant:
          type: string
          minLength: 1
          maxLength: 63
