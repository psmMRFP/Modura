openapi: 3.0.3
info:
  title: Modura HTTP API
  version: 0.1.0
  description: Authoritative HTTP contract for the Modura modular monolith.
servers:
  - url: /api
paths:
  /platform/places:
    get:
      operationId: listPlatformPlaces
      summary: listPlatformPlaces
      tags: [platform-places]
      security: [{platformBearerAuth: []}]
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        "200":
          description: Platform place result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedPlacePage"}
        "400": {$ref: "#/components/responses/PublicInvalidQuery"}
        "401": {$ref: "#/components/responses/AuthenticationFailed"}
        "403": {description: Platform session or CSRF verification failed}
        "404": {description: Place not found}
        "409": {description: "Stale edit, duplicate slug, or unpublished ancestor"}
        "500": {$ref: "#/components/responses/PublicInternalError"}
        "503": {$ref: "#/components/responses/PublicUnavailable"}
    post:
      operationId: createPlatformPlace
      summary: createPlatformPlace
      tags: [platform-places]
      security: [{platformBearerAuth: []}]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreatePlatformPlaceRequest"}
      responses:
        "201":
          description: Platform place result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedPlace"}
        "400": {$ref: "#/components/responses/PublicInvalidQuery"}
        "401": {$ref: "#/components/responses/AuthenticationFailed"}
        "403": {description: Platform session or CSRF verification failed}
        "404": {description: Place not found}
        "409": {description: "Stale edit, duplicate slug, or unpublished ancestor"}
        "500": {$ref: "#/components/responses/PublicInternalError"}
        "503": {$ref: "#/components/responses/PublicUnavailable"}
  /platform/places/{placeId}:
    get:
      operationId: getPlatformPlace
      summary: getPlatformPlace
      tags: [platform-places]
      security: [{platformBearerAuth: []}]
      parameters:
        - name: placeId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Platform place result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedPlace"}
        "400": {$ref: "#/components/responses/PublicInvalidQuery"}
        "401": {$ref: "#/components/responses/AuthenticationFailed"}
        "403": {description: Platform session or CSRF verification failed}
        "404": {description: Place not found}
        "409": {description: "Stale edit, duplicate slug, or unpublished ancestor"}
        "500": {$ref: "#/components/responses/PublicInternalError"}
        "503": {$ref: "#/components/responses/PublicUnavailable"}
    put:
      operationId: updatePlatformPlace
      summary: updatePlatformPlace
      tags: [platform-places]
      security: [{platformBearerAuth: []}]
      parameters:
        - name: placeId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdatePlatformPlaceRequest"}
      responses:
        "200":
          description: Platform place result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedPlace"}
        "400": {$ref: "#/components/responses/PublicInvalidQuery"}
        "401": {$ref: "#/components/responses/AuthenticationFailed"}
        "403": {description: Platform session or CSRF verification failed}
        "404": {description: Place not found}
        "409": {description: "Stale edit, duplicate slug, or unpublished ancestor"}
        "500": {$ref: "#/components/responses/PublicInternalError"}
        "503": {$ref: "#/components/responses/PublicUnavailable"}
  /platform/places/{placeId}/publication:
    put:
      operationId: setPlacePublication
      summary: setPlacePublication
      tags: [platform-places]
      security: [{platformBearerAuth: []}]
      parameters:
        - name: placeId
          in: path
          required: true
          schema: {type: string, format: uuid}
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetPlacePublicationRequest"}
      responses:
        "200":
          description: Platform place result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ManagedPlace"}
        "400": {$ref: "#/components/responses/PublicInvalidQuery"}
        "401": {$ref: "#/components/responses/AuthenticationFailed"}
        "403": {description: Platform session or CSRF verification failed}
        "404": {description: Place not found}
        "409": {description: "Stale edit, duplicate slug, or unpublished ancestor"}
        "500": {$ref: "#/components/responses/PublicInternalError"}
        "503": {$ref: "#/components/responses/PublicUnavailable"}
  /public/places:
    get:
      operationId: searchPublicPlaces
      summary: Search published places by stable slug, name or multilingual alias
      tags: [public-places]
      security: []
      parameters:
        - name: q
          in: query
          schema: {type: string, maxLength: 120, default: ""}
        - $ref: "#/components/parameters/PublicLocale"
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 50, default: 20}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 10000, default: 0}
      responses:
        "200":
          description: Published places only; no session is required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlacePage"
        "400":
          $ref: "#/components/responses/PublicInvalidQuery"
        "503":
          $ref: "#/components/responses/PublicUnavailable"
        "500":
          $ref: "#/components/responses/PublicInternalError"
  /public/places/{slug}:
    get:
      operationId: getPublicPlace
      summary: Read a published place by stable language-independent slug
      tags: [public-places]
      security: []
      parameters:
        - name: slug
          in: path
          required: true
          schema: {type: string, maxLength: 120, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'}
        - $ref: "#/components/parameters/PublicLocale"
      responses:
        "200":
          description: Published place with requested display language or canonical fallback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicPlace"
        "400":
          $ref: "#/components/responses/PublicInvalidQuery"
        "404":
          description: Not found; unpublished places are indistinguishable from missing ones
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/PublicUnavailable"
        "500":
          $ref: "#/components/responses/PublicInternalError"
  /livez:
    get:
      operationId: getLiveness
      summary: Report whether the process is alive
      tags: [system]
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /readyz:
    get:
      operationId: getReadiness
      summary: Report whether the process can serve traffic
      tags: [system]
      responses:
        "200":
          description: Process is ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
        "503":
          description: Process is not ready
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Problem"
  /auth/login:
    post:
      operationId: login
      summary: Establish a tenant-local session
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session established; the refresh secret is set as an HttpOnly cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "429":
          description: Credential throttling locked this tenant and login pair
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
  /platform/auth/login:
    post:
      operationId: platformLogin
      summary: Establish a global platform-administrator session
      tags: [platform-authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformLoginRequest"
      responses:
        "200":
          description: Platform session established with a distinct refresh cookie
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /platform/auth/refresh:
    post:
      operationId: platformRefresh
      summary: Rotate a platform-administrator refresh secret
      tags: [platform-authentication]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Platform session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /platform/auth/logout:
    post:
      operationId: platformLogout
      summary: Revoke the current platform-administrator session
      tags: [platform-authentication]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Platform session revoked and cookies cleared
          headers:
            Set-Cookie:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /platform/tenants:
    post:
      operationId: provisionPlatformTenant
      summary: Atomically provision a tenant as a global platform administrator
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProvisionTenantRequest"
      responses:
        "201":
          description: Tenant, first administrator, organization, and role were created atomically
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionTenantResponse"
        "200":
          description: The same completed provisioning request was returned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProvisionTenantResponse"
        "400":
          description: Invalid provisioning request
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "409":
          description: Idempotency key was reused with different input
    get:
      operationId: listPlatformTenants
      summary: List tenants as a global platform administrator
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      responses:
        "200":
          description: Tenant summaries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformTenant"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /platform/tenants/{tenantId}:
    parameters:
      - $ref: "#/components/parameters/TenantId"
    patch:
      operationId: updatePlatformTenant
      summary: Update a tenant's mutable platform profile
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePlatformTenantRequest"
      responses:
        "204":
          description: Tenant profile and audit evidence committed
        "400":
          description: Invalid tenant profile update
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          description: Tenant not found
        "409":
          description: Tenant profile was changed by another administrator
  /platform/tenants/{tenantId}/suspend:
    post:
      operationId: suspendPlatformTenant
      summary: Suspend an active tenant with auditable reason
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleRequest"
      responses:
        "204":
          description: Tenant suspended and audit evidence committed
        "400":
          description: Invalid lifecycle transition
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          description: Tenant not found
  /platform/tenants/{tenantId}/reactivate:
    post:
      operationId: reactivatePlatformTenant
      summary: Reactivate a suspended tenant with auditable reason
      tags: [platform-tenants]
      security:
        - platformBearerAuth: []
      parameters:
        - $ref: "#/components/parameters/TenantId"
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantLifecycleRequest"
      responses:
        "204":
          description: Tenant reactivated and audit evidence committed
        "400":
          description: Invalid lifecycle transition
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
        "404":
          description: Tenant not found
  /platform/settings/dictionaries:
    get:
      operationId: listPlatformDictionaries
      summary: List global dictionaries as a platform administrator
      tags: [platform-settings]
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Global dictionaries
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Dictionary" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
  /platform/settings/dictionaries/{dictionaryCode}:
    put:
      operationId: replacePlatformDictionary
      summary: Replace a complete global dictionary
      tags: [platform-settings]
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/DictionaryCode" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplacePlatformDictionaryRequest" }
      responses:
        "200":
          description: Global dictionary desired state stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Dictionary" }
        "400": { description: Invalid request }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "409": { description: Version conflict }
  /platform/settings/configurations:
    get:
      operationId: listPlatformConfigurations
      summary: List global non-secret configuration definitions and defaults
      tags: [platform-settings]
      security: [{ platformBearerAuth: [] }]
      responses:
        "200":
          description: Global configurations
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Configuration" } }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
  /platform/settings/configurations/{configurationKey}:
    put:
      operationId: putPlatformConfiguration
      summary: Create or update a global non-secret configuration
      tags: [platform-settings]
      security: [{ platformBearerAuth: [] }]
      parameters:
        - { $ref: "#/components/parameters/ConfigurationKey" }
        - { $ref: "#/components/parameters/CsrfToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PutPlatformConfigurationRequest" }
      responses:
        "200":
          description: Global configuration stored
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Configuration" }
        "400": { description: Invalid request }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "409": { description: Version conflict }
  /auth/refresh:
    post:
      operationId: refresh
      summary: Rotate the refresh secret and issue an access token
      tags: [authentication]
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/logout:
    post:
      operationId: logout
      summary: Revoke the current session
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: Session revoked and refresh cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/logout-all:
    post:
      operationId: logoutAll
      summary: Revoke every session for the authenticated tenant-local user
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "204":
          description: All sessions revoked and refresh cookie cleared
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /auth/password:
    put:
      operationId: changePassword
      summary: Change the current user's password and rotate its session
      tags: [authentication]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "200":
          description: Password changed, other sessions revoked, and current session rotated
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessTokenResponse"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/CsrfFailed"
  /users/me:
    get:
      operationId: getMyProfile
      summary: Read the authenticated user's profile
      tags: [identity]
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
    put:
      operationId: updateMyProfile
      summary: Update the authenticated user's mutable profile
      tags: [identity]
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserProfileRequest"
      responses:
        "200":
          description: Updated current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "400": { description: Invalid or duplicate profile data }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
  /users:
    get:
      operationId: listTenantUsers
      summary: List users in the authenticated tenant
      tags: [identity]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: identity.users, action: read }
      responses:
        "200":
          description: Tenant user catalogue
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/TenantUser" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
  /users/{userId}:
    parameters:
      - $ref: "#/components/parameters/UserId"
    get:
      operationId: getTenantUser
      summary: Read a tenant-owned user
      tags: [identity]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: identity.users, action: read }
      responses:
        "200":
          description: Tenant user detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUser" }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/AuthorizationFailed" }
        "404": { description: User not found in the tenant }
  /users/{userId}/disable:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: disableTenantUser
      summary: Disable a tenant-owned user account
      tags: [identity]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: identity.users, action: update }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DisableUserRequest"
      responses:
        "200":
          description: Disabled tenant user detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUser" }
        "400": { description: Invalid disable request }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "404": { description: User not found in the tenant }
  /users/{userId}/unlock:
    parameters:
      - $ref: "#/components/parameters/UserId"
    post:
      operationId: unlockTenantUser
      summary: Restore an abuse-locked tenant user account
      tags: [identity]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: identity.users, action: update }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      responses:
        "200":
          description: Unlocked tenant user detail
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantUser" }
        "400": { description: Unlock does not apply to this account state }
        "401": { $ref: "#/components/responses/AuthenticationFailed" }
        "403": { $ref: "#/components/responses/CsrfFailed" }
        "404": { description: User not found in the tenant }
  /auth/password-resets:
    post:
      operationId: resetPassword
      summary: Consume a password-reset token
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeCredentialRequest"
      responses:
        "204":
          description: Password replaced and all sessions revoked
        "400":
          description: Password policy or request validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /auth/invitations/accept:
    post:
      operationId: acceptInvitation
      summary: Consume an invitation and establish the first password
      tags: [authentication]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OneTimeCredentialRequest"
      responses:
        "204":
          description: Invitation accepted and local account activated
        "400":
          description: Password policy or request validation failed
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
  /organization/departments:
    get:
      operationId: listDepartments
      summary: List departments in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: organization.departments, action: read }
      responses:
        "200":
          description: Tenant department list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/AuthenticationFailed"
        "403":
          $ref: "#/components/responses/AuthorizationFailed"
    post:
      operationId: createDepartment
      summary: Create a department in the authenticated tenant
      tags: [organization]
      security:
        - bearerAuth: []
      x-modura-permission: { resource: organization.departments, action: create }
      parameters:
        - $ref: "#/components/parameters/CsrfToken"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDepartmentRequest"
      responses:
        "201":
          description: Department created
          content:
